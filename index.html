<title>巴式密码 · ТНВ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --r:28px;--ink:#f3f5ff;--dim:rgba(243,245,255,.58);--dim2:rgba(243,245,255,.38);
    --line:rgba(255,255,255,.13);
  }
  html,body{height:100%}
  body{
    margin:0;background:#04050a;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  }
  .blobs{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(72px) saturate(165%);
    background:
      radial-gradient(36% 32% at 16% 20%,rgba(104,86,255,.85),transparent 70%),
      radial-gradient(30% 28% at 84% 10%,rgba(0,196,255,.55),transparent 70%),
      radial-gradient(40% 36% at 74% 86%,rgba(255,78,166,.52),transparent 72%),
      radial-gradient(28% 28% at 18% 90%,rgba(255,196,84,.42),transparent 72%),
      radial-gradient(62% 62% at 50% 46%,rgba(18,26,74,.62),transparent 76%);
    animation:drift 26s ease-in-out infinite alternate;}
  .blobs.b2{mix-blend-mode:screen;opacity:.45;
    background:radial-gradient(26% 22% at 62% 32%,rgba(120,255,214,.5),transparent 70%),
      radial-gradient(24% 20% at 36% 66%,rgba(180,120,255,.55),transparent 72%);
    animation:drift2 34s ease-in-out infinite alternate;}
  @keyframes drift{0%{transform:translate3d(-2%,-1%,0) scale(1.02)}50%{transform:translate3d(3%,2%,0) scale(1.09)}100%{transform:translate3d(-1%,4%,0) scale(1.03)}}
  @keyframes drift2{0%{transform:translate3d(4%,3%,0) rotate(0) scale(1.05)}100%{transform:translate3d(-3%,-2%,0) rotate(8deg) scale(1.12)}}
  .noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 0%,transparent 30%,rgba(0,0,0,.55) 100%)}

  .glass{position:relative;border-radius:var(--r);
    background:linear-gradient(140deg,rgba(255,255,255,.105),rgba(255,255,255,.032) 44%,rgba(255,255,255,.062));
    border:1px solid rgba(255,255,255,.1);
    -webkit-backdrop-filter:blur(30px) saturate(190%) brightness(1.06);
    backdrop-filter:blur(30px) saturate(190%) brightness(1.06);
    box-shadow:0 34px 80px -26px rgba(0,0,0,.72),0 2px 8px rgba(0,0,0,.28),
      inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.055),inset 0 0 44px rgba(255,255,255,.035);
    overflow:hidden;isolation:isolate}
  .glass::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
    background:radial-gradient(160px 160px at var(--mx,50%) var(--my,-20%),rgba(255,255,255,.34),transparent 70%),
      radial-gradient(420px 420px at calc(100% - var(--mx,50%)) calc(100% - var(--my,120%)),rgba(140,170,255,.14),transparent 72%),
      conic-gradient(from var(--ang,0deg) at 50% 50%,rgba(255,255,255,.10),transparent 22%,rgba(255,255,255,.075) 48%,transparent 72%,rgba(255,255,255,.10));
    opacity:.75;mix-blend-mode:screen}
  .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 22px 46px -34px rgba(255,255,255,.9)}

  main{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:30px 22px 64px;display:flex;flex-direction:column;gap:20px}
  .hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px 26px}
  .brand{display:flex;align-items:center;gap:16px;min-width:0}
  .logo{width:52px;height:52px;flex:0 0 52px;border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:700;
    background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.28);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 26px -14px rgba(120,130,255,.95)}
  h1{margin:0 0 4px;font-size:25px;letter-spacing:-.6px;font-weight:700;
    background:linear-gradient(92deg,#fff,#c2ccff 62%,#9fe4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:0;font-size:13px;line-height:1.6;color:var(--dim)}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .badge{font-size:11px;letter-spacing:.08em;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
    color:rgba(240,244,255,.72);background:rgba(255,255,255,.05)}
  .keybox{display:flex;flex-direction:column;gap:7px;min-width:250px}
  .keyrow{display:flex;gap:8px;align-items:center}
  .key{flex:1;min-width:0;height:42px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
    border:1px solid var(--line);color:var(--ink);font-size:14px;letter-spacing:.08em;padding:0 14px;outline:none;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
  .key:focus{border-color:rgba(150,160,255,.6);box-shadow:0 0 0 4px rgba(120,130,255,.16),inset 0 1px 0 rgba(255,255,255,.2)}
  .iconbtn{width:42px;height:42px;flex:0 0 42px;border-radius:13px;cursor:pointer;border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));color:var(--ink);font-size:16px;line-height:1;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px -12px rgba(0,0,0,.9);
    transition:transform .18s cubic-bezier(.2,.9,.2,1),background .22s}
  .iconbtn:hover{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.08));transform:translateY(-1px)}
  .iconbtn:active{transform:scale(.95)}

  .grid{display:grid;grid-template-columns:1.03fr .97fr;gap:20px;align-items:start}
  .lower{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  @media (max-width:1040px){.grid,.lower{grid-template-columns:1fr}}

  .panel{padding:22px;display:flex;flex-direction:column;gap:16px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .panel-t{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
  .dotlive{width:8px;height:8px;border-radius:50%;background:linear-gradient(180deg,#8affd0,#25d6a0);box-shadow:0 0 12px rgba(63,255,196,.85)}
  .count{font-size:12px;color:var(--dim2);font-family:"SF Mono",ui-monospace,Menlo,monospace}
  .lbl{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dim);margin:0 0 8px}

  main{max-width:1080px;padding:22px 18px 44px;gap:12px}

  .glass{border-radius:8px;background:#111;border:1px solid #242424;
    -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
  .glass::before,.glass::after{display:none}
  .panel,.hero{border-radius:8px}

  .hero{padding:14px 16px;gap:14px}
  .brand{gap:11px}
  .logo{width:32px;height:32px;flex-basis:32px;border-radius:6px;font-size:14px;font-weight:500;
    background:#1a1a1a;border:1px solid #2b2b2b;box-shadow:none;color:#f0f0f0}
  h1{font-size:17px;font-weight:600;letter-spacing:0;background:none;color:#f2f2f2}
  .sub{font-size:11.5px;line-height:1.5;color:#8a8a8a;max-width:56ch}
  .badges{gap:5px;margin-top:6px}
  .badge{font-size:10px;letter-spacing:.02em;padding:2px 7px;border-radius:4px;
    border:1px solid #262626;background:#151515;color:#8a8a8a}
  .keybox .lbl{font-size:9.5px;letter-spacing:.16em;color:#707070}
  .key{height:30px;border-radius:5px;background:#090909;border:1px solid #2a2a2a;
    color:#e8e8e8;font-size:12px;box-shadow:none}
  .key:focus{border-color:#4d4d4d;box-shadow:none}
  .iconbtn{width:30px;height:30px;flex-basis:30px;border-radius:5px;font-size:13px;
    background:#161616;border:1px solid #2a2a2a;color:#b5b5b5;box-shadow:none}
  .iconbtn:hover{background:#232323;border-color:#3a3a3a;color:#fff}
  .iconbtn.act{background:#eaeaea;border-color:#eaeaea;color:#000}

  .modebar{margin-top:8px;gap:10px}
  #modeseg{gap:2px;padding:2px;border-radius:6px;border:1px solid #242424;background:#111}
  #modeseg .btn.seg-b{border:none;border-radius:4px;padding:5px 12px;font-size:11.5px;color:#8a8a8a}
  #modeseg .btn.seg-b:hover{color:#ddd}
  #modeseg .btn.seg-b.act{background:#eaeaea;color:#000;box-shadow:none}
  .modehint{font-size:11px;color:#6f6f6f}

  .panel{padding:16px;gap:12px}
  .panel-h{padding-bottom:9px;border-bottom:1px solid #1e1e1e}
  .panel-t{font-size:12.5px;font-weight:500;color:#dedede;gap:7px}
  .dotlive{width:5px;height:5px;border-radius:2px;background:#5a5a5a;box-shadow:none}
  .count{font-size:10.5px;color:#6a6a6a;letter-spacing:.04em}
  .lbl{font-size:9.5px;letter-spacing:.14em;color:#6a6a6a;margin-bottom:6px}
  .lbl span:last-child{font-size:10px;color:#5c5c5c}

  .input{min-height:170px;border-radius:6px;padding:11px 12px;font-size:13.5px;line-height:1.8;
    background:#090909;border:1px solid #222;color:#e6e6e6;box-shadow:none}
  .input:focus{border-color:#454545;box-shadow:none}
  .input::placeholder{color:#555;font-size:12.5px}
  .out{min-height:180px;padding:12px;border-radius:6px;font-size:14px;line-height:1.85;
    background:#080808;border:1px solid #1e1e1e;color:#e6e6e6;box-shadow:none}
  .out .ph{font-size:12px;color:#555;letter-spacing:.02em}
  .plain{color:#e6e6e6;font-size:13.5px}

  .btn{border-radius:5px;padding:6px 11px;font-size:11.5px;font-weight:500;
    border:1px solid #2a2a2a;background:#171717;color:#ddd;box-shadow:none}
  .btn:hover{transform:none;background:#232323;border-color:#3a3a3a;color:#fff;box-shadow:none}
  .btn:active{transform:none}
  .btn.ghost{background:transparent;border-color:#242424;color:#9c9c9c}
  .btn.ghost:hover{background:#1b1b1b;color:#eee;border-color:#333}
  .btn.primary{background:#ededed;border-color:#ededed;color:#000;box-shadow:none}
  .btn.primary:hover{background:#fff;border-color:#fff;color:#000}
  .btn.sm{padding:5px 10px;font-size:11px;border-radius:5px}
  .btn.seg-b{border-radius:4px;padding:4px 9px;font-size:10.5px}
  .btn.seg-b.act{background:#eaeaea;border-color:#eaeaea;color:#000;box-shadow:none}

  #chips .chip{justify-content:center;align-items:center;text-align:center}
  .chip{padding:5px 8px 6px;border-radius:5px;font-size:11px;border:1px solid #242424;background:#131313;color:#999}
  .chip .zh{font-size:9px;color:#6d6d6d}
  .chip .d{width:5px;height:5px;border-radius:2px;background:#5f5f5f!important;box-shadow:none!important}
  .chip.on{background:#1f1f1f;border-color:#3d3d3d;color:#fff;box-shadow:none}
  .chip.on .zh{color:#8f8f8f}
  .chip:hover{background:#1b1b1b;transform:none}
  .chip.off{opacity:.45}

  .sl-label{font-size:10.5px;color:#8a8a8a}
  .sv{font-size:10.5px;color:#c9c9c9}
  input[type=range]{height:18px}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:0;
    background:linear-gradient(90deg,#e8e8e8 0 var(--v,60%),#242424 var(--v,60%) 100%);box-shadow:none}
  input[type=range]::-webkit-slider-thumb{width:11px;height:11px;margin-top:-4px;border-radius:2px;
    background:#e8e8e8;border:none;box-shadow:none}
  input[type=range]::-moz-range-track{height:3px;background:#242424;border-radius:0}
  input[type=range]::-moz-range-progress{height:3px;background:#e8e8e8}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:2px;background:#e8e8e8;border:none}

  .bar{height:2px;border-radius:0;background:#202020}
  .bar i{background:#8f8f8f!important}
  .st{font-size:10.5px;color:#8a8a8a}
  .st .name{color:#b5b5b5}
  .st .n{color:#666}
  .kv{padding:6px 0;font-size:11px;border-color:#191919;color:#8a8a8a}
  .kv span:last-child{font-size:11px;color:#cfcfcf}
  .legend{font-size:10px;color:#777}
  .lg i{border-radius:2px;background:#666}
  .note{font-size:11px;line-height:1.85;color:#707070}
  .note b{color:#c0c0c0;font-weight:500}
  .hr{height:1px;background:#1a1a1a;margin:1px -16px}
  .toast{background:#eaeaea;color:#000;border:1px solid #eaeaea;border-radius:6px;
    -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 8px 24px rgba(0,0,0,.6)}
  @media (max-width:560px){
    main{padding:14px 10px 36px}
    .hero{padding:12px 13px}
    h1{font-size:15.5px}
    .panel{padding:13px}
    .hr{margin:1px -13px}
  }
</style>

<style>
  /* ============ 一点橙红：只落在关键位置 ============ */
  :root{--acc:#ff5a3c;--acc-soft:rgba(255,90,60,.16);--acc-line:rgba(255,90,60,.34)}
  .dotlive{background:var(--acc);box-shadow:none}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.primary:hover{background:#ff7055;border-color:#ff7055;color:#fff}
  #modeseg .btn.seg-b.act{background:#1a1210;color:#ff8a70;box-shadow:inset 0 0 0 1px var(--acc-line)}
  .chip.on .d{background:var(--acc)!important}
  .chip.on{border-color:#3d3d3d}
  input[type=range]::-webkit-slider-runnable-track{
    background:linear-gradient(90deg,var(--acc) 0 var(--v,60%),#242424 var(--v,60%) 100%)}
  input[type=range]::-moz-range-progress{background:var(--acc)}
  .key:focus{border-color:var(--acc-line);box-shadow:0 0 0 1px var(--acc-soft)}
  #zhwseg .btn.seg-b.act{background:#1a1210;border-color:var(--acc-line);color:#ff8a70}
  .badge#b-words{color:#ff8a70;border-color:var(--acc-line)}
  .st .bar i{background:#8f8f8f!important}
</style>
<style>
  /* ============ 手写 ТНВ 标识 ============ */
  .logo{width:auto!important;height:34px!important;flex:0 0 auto!important;
        border-radius:0!important;background:none!important;border:0!important;
        box-shadow:none!important;padding:0!important;opacity:.94;display:block}
  .logo:hover{opacity:1}
  @media (max-width:640px){.logo{height:26px!important}}
</style>
<style>
  /* ============ 同行卡片等高：列间缝隙对齐 ============ */
  .grid,.lower{align-items:stretch}
  .grid>.panel,.lower>.panel{display:flex;flex-direction:column}
  .grid>.panel>#out,.grid>.panel>#gout,.grid>.panel>#gback,.lower>.panel>#decoded{flex:1 1 auto}
  .grid>.panel>#input,.grid>.panel>#gin,.lower>.panel>#cipher{flex:1 1 auto}
</style>
<style>
  .grid>.panel>.growbox,.lower>.panel>.growbox{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .growbox>.input{flex:1 1 auto;min-height:90px}
</style>
</head>

/* ---------- 索引 ---------- */
const byZh = new Map();
const byEn = new Map();
const byLang = {};
Object.keys(FIELD).forEach(k => { if (k !== "zh") byLang[k] = new Map(); });
let maxZhLen = 2;

function indexRow(row){
  // 中文侧只认第一个写法：同义缩写（如“熄灭/熄/灭”）若都建索引，
  // 还原时会被归一成首词，导致原文对不上，所以其余写法走原样保留。
  const zhKey = row[0].split("/")[0];
  if (zhKey){
    if (!byZh.has(zhKey)) byZh.set(zhKey, row);
    if (zhKey.length > maxZhLen) maxZhLen = zhKey.length;
  }
  row[1].split("/").forEach(e => {
    const k = e.toLowerCase();
    if (k && !byEn.has(k)) byEn.set(k, row);
    if (e && !byEn.has(e)) byEn.set(e, row);
  });
  for (const lang in byLang){
    const v = row[FIELD[lang]];
    if (!v) continue;
    v.split("/").forEach(one => {
      if (one && !byLang[lang].has(one)) byLang[lang].set(one, row);
    });
  }
}
LEX.forEach(indexRow);

function addRow(row){
  if (!row || !row[0]) return 0;
  while (row.length < 11) row.push("");
  LEX.push(row);
  indexRow(row);
  return 1;
}

/* ---------- 确定性随机 ---------- */
function makeRng(seedStr){
  let s = 0;
  for (const ch of seedStr){ s = (Math.imul(s ^ ch.codePointAt(0), 2654435761) + 0x9e3779b9) >>> 0; }
  if (!s) s = 0x1234567;
  return function(){
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
function pick(r, arr){ return arr[Math.min(arr.length - 1, (r() * arr.length) | 0)]; }

/* ---------- 分词 ---------- */
const WORDCH = /[A-Za-z\u00C0-\u024F\u0400-\u04FF\u4E00-\u9FFF\u3400-\u4DBF\u3040-\u30FF\uAC00-\uD7AF\u0F00-\u0FFF\u0600-\u06FF\u0750-\u077F\u31C0-\u31EF]/;
function isWordChar(c){ return WORDCH.test(c); }
const HAN = /[\u4E00-\u9FFF\u3400-\u4DBF]/;

function tokenize(text){
  const tk = [];
  let i = 0, mEsc = null;
  while (i < text.length){
    const c = text[i];
    if (/\s/.test(c)){
      let j = i; while (j < text.length && /\s/.test(text[j])) j++;
      tk.push({ t:"ws", v:text.slice(i,j) }); i = j;
    } else if ((mEsc = /^u[0-9a-f]{4,5}/i.exec(text.slice(i))) && !/[0-9A-Za-z]/.test(text.charAt(i + mEsc[0].length))){
      // 未收录字转码 u4e2d 必须整体当一个词，不能被数字切碎
      tk.push({ t:"w", v:mEsc[0] }); i += mEsc[0].length;
    } else if (/[0-9]/.test(c)){
      let j = i; while (j < text.length && /[0-9]/.test(text[j])) j++;
      tk.push({ t:"num", v:text.slice(i,j) }); i = j;
    } else if (!isWordChar(c)){
      tk.push({ t:"p", v:c }); i++;
    } else {
      let j = i; while (j < text.length && isWordChar(text[j])) j++;
      tk.push({ t:"w", v:text.slice(i,j) }); i = j;
    }
  }
  return tk;
}

/* 中文串做最大匹配切词；查不到的字单独成词 */
function splitHan(raw){
  const out = [];
  let i = 0;
  while (i < raw.length){
    let hit = null;
    for (let len = Math.min(maxZhLen, raw.length - i); len >= 1; len--){
      const s = raw.slice(i, i + len);
      if (byZh.has(s)) { hit = s; break; }
    }
    if (hit){ out.push(hit); i += hit.length; }
    else { out.push(raw[i]); i++; }
  }
  return out;
}

function escToken(u){
  return "u" + u.codePointAt(0).toString(16).toLowerCase();
}
function unEscToken(t){
  const m = /^u([0-9a-f]{4,5})$/i.exec(t);
  if (!m) return null;
  const cp = parseInt(m[1], 16);
  if (cp < 0x3000 || cp > 0x2FFFF) return null;
  try { return String.fromCodePoint(cp); } catch(e){ return null; }
}

function esc(s){
  return s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;" }[c]));
}

/* 取某语言对应的词；缺则从已勾选的其他语言里借一个 */
function wordFor(row, lang, langs, r, zhw){
  let w = row[FIELD[lang]];
  if (w) return { w: w.split("/")[0], lang };
  // 借词时也要守“中文输出”设置：中文设成关闭，就别从中文列借词回来
  let alts = langs.filter(k => row[FIELD[k]] && !(k === "zh" && zhw === 0));
  if (!alts.length) alts = langs.filter(k => row[FIELD[k]]);
  if (alts.length){
    const alt = alts[(r() * alts.length) | 0];
    return { w: row[FIELD[alt]].split("/")[0], lang: alt };
  }
  return null;
}

const SPACE_LANGS = { es:1, fr:1, de:1, en:1, ru:1, mn:1 };

function encode(text, opt){
  const langs = opt.langs.slice();
  const counts = {};
  langs.forEach(k => counts[k] = 0);
  const zhw = opt.zhw == null ? 1 : opt.zhw;
  const r = makeRng(opt.key + "§" + langs.join(",") + "§" + opt.mix.toFixed(2) + "§" + opt.rate.toFixed(2) + "§" + (opt.gap ? 1 : 0) + "§" + zhw);

  let out = "";
  let prevLang = null;
  let phraseStart = true;
  let gapPending = false;
  let lastLatin = false;
  let unknown = 0, words = 0;
  const unknownList = [];

  const tokens = tokenize(text);
  for (const tk of tokens){
    if (tk.t === "ws"){
      const brk = (tk.v.match(/\n/g) || []).length;
      if (brk){ out += "\n".repeat(brk); phraseStart = true; gapPending = true; lastLatin = false; }
      continue;
    }
    if (tk.t === "p"){
      out += esc(tk.v);
      gapPending = !/^[(\["\u201C\u300A\u3008]$/.test(tk.v);
      lastLatin = false;
      if (/[.。!！?？;；:：…]/.test(tk.v)) phraseStart = true;
      else if (/[,，、]/.test(tk.v)) phraseStart = false;
      continue;
    }
    if (tk.t === "num"){
      if (gapPending && (opt.gap || lastLatin)) out += " ";
      out += esc(tk.v);
      gapPending = true; lastLatin = false;
      continue;
    }

    const units = HAN.test(tk.v) ? splitHan(tk.v) : [tk.v];
    for (const u of units){
      words++;
      const lower = u.toLowerCase();
      const row = byZh.get(u) || byEn.get(lower) || byLang.en.get(lower)
        || byLang.es.get(u) || byLang.fr.get(u) || byLang.de.get(u) || byLang.ru.get(u)
        || byLang.ja.get(u) || byLang.ko.get(u) || byLang.mn.get(u) || byLang.bo.get(u) || byLang.ug.get(u);

      if (!row){
        unknown++;
        if (unknownList.indexOf(u) < 0) unknownList.push(u);
        if (gapPending) out += " ";
        const shown = (opt.esc && HAN.test(u)) ? escToken(u) : esc(u);
        out += '<span class="unk">' + shown + "</span>";
        gapPending = true; phraseStart = false;
        lastLatin = /[A-Za-z\u0400-\u04FF]$/.test(u);
        continue;
      }
      if (r() > opt.rate){
        if (gapPending) out += " ";
        const shown2 = (opt.esc && HAN.test(u)) ? escToken(u) : esc(u);
        out += '<span class="unk">' + shown2 + "</span>";
        gapPending = true; phraseStart = false;
        lastLatin = /[A-Za-z\u0400-\u04FF]$/.test(u);
        continue;
      }

      // 权重：中文按 zhw（0/1/3），其余语种各 3 份，于是“少量”时中文约占 1/(10*3+1)
      const wt = k => (k === "zh" ? zhw : 3);
      let lang;
      if (prevLang && langs.length > 1 && !phraseStart && wt(prevLang) > 0 && r() >= opt.mix){
        lang = prevLang;
      } else {
        let list = langs.filter(k => wt(k) > 0 && (langs.length === 1 || k !== prevLang));
        if (!list.length) list = langs.filter(k => wt(k) > 0);
        if (!list.length) list = langs.slice();
        let total = 0;
        list.forEach(k => total += wt(k));
        let x = r() * total, pick = list[0];
        for (const k of list){ x -= wt(k); if (x < 0){ pick = k; break; } }
        lang = pick;
      }

      const res = wordFor(row, lang, langs, r, zhw);
      if (!res){
        unknown++;
        if (gapPending) out += " ";
        out += '<span class="unk">' + esc(u) + "</span>";
        gapPending = true; phraseStart = false; lastLatin = false;
        continue;
      }

      if (gapPending && (opt.gap || lastLatin || SPACE_LANGS[res.lang])) out += " ";
      out += '<span class="w" style="--h:' + LANGS[res.lang].h + '" data-l="' + res.lang + '">' + esc(res.w) + "</span>";
      counts[res.lang] = (counts[res.lang] || 0) + 1;
      prevLang = res.lang;
      phraseStart = false;
      gapPending = true;
      lastLatin = !!SPACE_LANGS[res.lang];
    }
  }

  return { html: out, counts, unknown, words, unknownList };
}

/* ---------- 还原 ---------- */
// 查表顺序按“还原目标”决定：中文优先认中文原词（汉字与日文汉字同形，
// 若先查日文表，未收录的“道”会被当成日文“道”还原成“路”），英文优先认英文原词。
function decRow(raw, target){
  // 单个汉字只可能来自中文词表或“未收录原样保留”，绝不可能是日文单字词
  // （日文单字与汉字同形会造成串义，编码侧已把这类日文词剔掉）。
  if (target !== "en" && raw.length === 1 && /[\u4e00-\u9fff]/.test(raw)){
    return byZh.get(raw) || null;
  }
  const langOrder = [byLang.ja, byLang.ko, byLang.bo, byLang.ug, byLang.ru, byLang.mn, byLang.es, byLang.fr, byLang.de, byLang.en];
  const lists = target === "en"
    ? [byEn, byLang.en, byZh].concat(langOrder)
    : [byZh].concat(langOrder);
  for (const m of lists){
    if (!m) continue;
    let hit = m.get(raw);
    if (!hit) hit = m.get(raw.toLowerCase());
    if (hit) return hit;
  }
  return null;
}

function decode(text, target){
  const tokens = tokenize(text);
  let out = "", hit = 0, miss = 0;
  let gapPending = false, lastLatin = false;
  for (const tk of tokens){
    if (tk.t === "ws"){
      const brk = (tk.v.match(/\n/g) || []).length;
      if (brk){ out += "\n".repeat(brk); gapPending = true; lastLatin = false; }
      continue;
    }
    if (tk.t === "p"){
      out += tk.v;
      gapPending = !/^[(\["\u201C\u300A\u3008]$/.test(tk.v);
      lastLatin = false;
      continue;
    }
    if (tk.t === "num"){
      if (gapPending && (target === "en" || lastLatin)) out += " ";
      out += tk.v;
      gapPending = true; lastLatin = false;
      continue;
    }

    const raw = tk.v;
    const unhidden = unEscToken(raw);
    if (unhidden){
      hit++;
      const curLatin4 = /^[A-Za-z\u0400-\u04FF]/.test(unhidden);
      if (gapPending && (target === "en" || lastLatin || curLatin4)) out += " ";
      out += unhidden;
      gapPending = true; lastLatin = false;
      continue;
    }
    const row = decRow(raw, target);

    let piece;
    if (row){ hit++; piece = target === "en" ? row[1].split("/")[0] : row[0].split("/")[0]; }
    else { miss++; piece = raw; }

    const curLatin = /^[A-Za-z\u0400-\u04FF]/.test(piece);
    // 还原成中文时不补空格：中文原文本来就没有词间空格，补了就对不上原文
    const wantSpace = target === "en";
    if (gapPending && wantSpace) out += " ";
    out += piece;
    gapPending = true;
    lastLatin = /[A-Za-z\u0400-\u04FF]$/.test(piece);
  }
  const rate = hit + miss ? Math.round(hit / (hit + miss) * 100) : 0;
  return { text: out, hit, miss, rate };
}

  function parseCsvLine(line){
    const out = [];
    let cur = "", q = false;
    for (let i = 0; i < line.length; i++){
      const c = line[i];
      if (q){
        if (c === '"'){ if (line[i + 1] === '"'){ cur += '"'; i++; } else q = false; }
        else cur += c;
      } else {
        if (c === '"') q = true;
        else if (c === ","){ out.push(cur); cur = ""; }
        else cur += c;
      }
    }
    out.push(cur);
    return out;
  }

      const show = keyEl.type === "password";
      keyEl.type = show ? "text" : "password";
      keyEye.classList.toggle("act", show);
    });
    keyEl.addEventListener("blur", e => {
      if (keyEl.type === "text" && e.relatedTarget !== keyEye){
        keyEl.type = "password";
        keyEye.classList.remove("act");
      }
    });
  }
  [...el("modeseg").querySelectorAll("button")].forEach(b => b.addEventListener("click", () => setMode(b.dataset.m)));
  setMode("w");

  /* ---------------- 本地存档：关掉浏览器也不丢 ---------------- */
  const LS_KEY = "ba.local.v1";
  let saveT = 0;

  function collect(){
    return {
      v: 1, t: Date.now(),
      key: keyEl.value,
      mode: window.__mode || "w",
      input: inputEl.value,
      cipher: cipherEl.value,
      gin: el("gin").value,
      gdec: el("gdec").value,
      langs: state.langs.slice(),
      mix: state.mix, rate: state.rate,
      color: state.color, gap: state.gap, esc: state.esc, zhw: state.zhw,
      gibWrap: gibWrap, gibColor: gibColor
    };
  }
  function saveNow(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(collect())); }catch(e){}
  }
  function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 500); }
  function applySaved(o){
    if (!o || typeof o !== "object") return false;
    try{
      if (typeof o.key === "string" && o.key) keyEl.value = o.key;
      if (Array.isArray(o.langs) && o.langs.length){
        const keep = o.langs.filter(k => ORDER.indexOf(k) >= 0);
        if (keep.length) state.langs = keep;
      }
      if (typeof o.mix === "number") state.mix = o.mix;
      if (typeof o.rate === "number") state.rate = o.rate;
      if (typeof o.color === "boolean") state.color = o.color;
      if (typeof o.gap === "boolean") state.gap = o.gap;
      if (typeof o.esc === "boolean") state.esc = o.esc;
      state.zhw = o.zhw ? 1 : 0;
      if (typeof o.gibWrap === "boolean"){
        gibWrap = o.gibWrap;
        el("gwrap").textContent = "每 5 字符断行：" + (gibWrap ? "开" : "关");
      }
      if (typeof o.gibColor === "boolean"){
        gibColor = o.gibColor;
        el("gcolor").textContent = "分色：" + (gibColor ? "开" : "关");
      }
      mixEl.value = Math.round(state.mix * 100); syncRange(mixEl, mixvEl);
      rateEl.value = Math.round(state.rate * 100); syncRange(rateEl, ratevEl);
      if (zhwSeg) [...zhwSeg.querySelectorAll("button")].forEach(x => x.classList.toggle("act", +x.dataset.z === state.zhw));
      syncChips();
      outEl.classList.toggle("nocolor", !state.color);
      if (typeof o.input === "string") inputEl.value = o.input;
      if (typeof o.cipher === "string") cipherEl.value = o.cipher;
      if (typeof o.gin === "string") el("gin").value = o.gin;
      if (typeof o.gdec === "string") el("gdec").value = o.gdec;
      return true;
    }catch(e){ return false; }
  }

  /* 初始 */
  dictStats();
  renderUnknown();
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY) || "null"); }catch(e){ saved = null; }
  const hadSaved = applySaved(saved);
  if (!hadSaved || !inputEl.value.trim()) inputEl.value = SAMPLE;
  render();
  if (hadSaved){
    if (el("gin").value.trim()) gibRender();
    gCountUpdate();
    setMode(saved.mode === "g" ? "g" : "w");
  }

  /* 改动即存；页面隐藏 / 关闭时再补存一次 */
  document.addEventListener("input", saveSoon, true);
  document.addEventListener("change", saveSoon, true);
  document.addEventListener("click", saveSoon, true);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });
  window.addEventListener("pagehide", saveNow);
  window.addEventListener("beforeunload", saveNow);
}

/* ============================================================
   乱码编译：西里尔 / 拉丁 / 数字 三套字符表（3 字符 = 1 个原字符）
   ============================================================ */
const G_CYR_U = "АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯЁ";
const G_CYR_L = "абвгдежзийклмнопрстуфхцчшщъыьэюяё";
const G_LAT_U = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const G_LAT_L = "abcdefghijklmnopqrstuvwxyz";
const G_DIG   = "0123456789";
const G_ALPH  = Array.from(new Set((G_CYR_U + G_CYR_L + G_LAT_U + G_LAT_L + G_DIG).split("")));
const G_IX    = {};
G_ALPH.forEach((c, i) => { G_IX[c] = i; });
const G_M = 128 * 128 * 128;
const G_KIND = {};
G_CYR_U.split("").forEach(c => G_KIND[c] = "c");
G_CYR_L.split("").forEach(c => G_KIND[c] = "c");
G_LAT_U.split("").forEach(c => G_KIND[c] = "l");
G_LAT_L.split("").forEach(c => G_KIND[c] = "l");
G_DIG.split("").forEach(c => G_KIND[c] = "n");

function gHash(str){
  let h = 2166136261 >>> 0;
  for (const ch of str){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

/* 编译：每个码位 + 密钥流 → 3 个乱码字符；末尾附 1 个 21 位校验字符 */
function gibPack(text, key, wrap){
  const r = makeRng("§gib§" + String(key));
  const cps = [];
  for (const ch of text) cps.push(ch.codePointAt(0));
  cps.push(gHash(text) & 0x1FFFFF);
  let out = "";
  for (let i = 0; i < cps.length; i++){
    const v = (cps[i] + Math.floor(r() * G_M)) % G_M;
    out += G_ALPH[Math.floor(v / 16384)] + G_ALPH[Math.floor(v / 128) % 128] + G_ALPH[v % 128];
    if (wrap && (i + 1) % 5 === 0) out += ((i + 1) % 30 === 0 ? "\n" : " ");
  }
  return out;
}

/* 还原：非字符表内容（空格、换行、误贴的标点）一律忽略 */
function gibUnpack(cipher, key){
  const r = makeRng("§gib§" + String(key));
  const ix = [];
  for (const ch of String(cipher)){ const k = G_IX[ch]; if (k !== undefined) ix.push(k); }
  if (!ix.length) return { ok:false, msg:"没有识别到乱码字符" };
  if (ix.length % 3) return { ok:false, msg:"乱码长度不是 3 的倍数，可能被截断或掺入了别的内容" };
  if (ix.length < 6) return { ok:false, msg:"乱码太短" };
  const cps = [];
  for (let i = 0; i < ix.length; i += 3){
    const v = ix[i] * 16384 + ix[i+1] * 128 + ix[i+2];
    cps.push((v - Math.floor(r() * G_M) + G_M) % G_M);
  }
  /* 先按新版（1 个校验字符）试，再回退旧版（2 个校验字符） */
  function bodyText(body){
    let text = "", bad = 0;
    for (const cp of body){
      if (cp > 0x10FFFF){ bad++; continue; }
      text += String.fromCodePoint(cp);
    }
    return { text, bad };
  }
  if (cps.length >= 2){
    const b = bodyText(cps.slice(0, -1));
    if (b.bad === 0 && cps[cps.length - 1] === (gHash(b.text) & 0x1FFFFF))
      return { ok:true, text:b.text, chars: b.text.length };
  }
  if (cps.length >= 3){
    const b = bodyText(cps.slice(0, -2));
    const h = gHash(b.text);
    if (b.bad === 0 && cps[cps.length - 2] === 0xE000 + (h % 0x1000) && cps[cps.length - 1] === 0xE000 + ((h >>> 12) % 0x1000))
      return { ok:true, text:b.text, chars: b.text.length };
  }
  let text = "", bad = 0;
  for (const cp of cps.slice(0, -2)){
    if (cp > 0x10FFFF){ bad++; continue; }
    text += String.fromCodePoint(cp);
  }
  return { ok:false, msg:"密钥不对、或乱码在传输中被改动过", text };
}

if (typeof document !== "undefined"){
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
